version: "2"

run:
  timeout: 5m

issues:
  # デフォルトは max-same-issues: 3 / max-issues-per-linter: 50 で警告が抑制される。
  # 同種警告が大量にあると見落とすので、両方とも上限解除する。
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - gosec
  settings:
    errcheck:
      # 戻り値のエラーを無視しても実害が小さい関数はプロジェクト全体で除外する
      exclude-functions:
        - (io.Closer).Close
        - (*encoding/json.Encoder).Encode
    gosec:
      excludes:
        # G104 (Errors unhandled) は errcheck と機能重複するため除外
        - G104
        # G706 (Log injection) は環境変数や DB 値の log.Printf で誤検知が多いため除外
        - G706

formatters:
  enable:
    - gofmt
    - goimports
